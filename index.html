<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Snow Ride 3D</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }

    #score {
      position: fixed;
      top: 15px;
      left: 15px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      z-index: 10;
      text-shadow: 2px 2px 3px black;
    }

    #info {
      position: fixed;
      bottom: 15px;
      left: 15px;
      color: white;
      font-size: 16px;
      z-index: 10;
      text-shadow: 2px 2px 3px black;
    }

    /* GAME OVER SCREEN */

    #gameOverScreen {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.75);

      color: white;

      z-index: 20;

      justify-content: center;
      align-items: center;

      text-align: center;
    }

    #gameOverBox {
      background: #222;
      padding: 35px;
      border-radius: 20px;
      min-width: 260px;
      box-shadow: 0 0 30px black;
    }

    #gameOverBox h1 {
      margin-top: 0;
      font-size: 40px;
    }

    #finalScore {
      font-size: 25px;
      margin: 15px;
    }

    #bestScore {
      font-size: 22px;
      margin: 15px;
    }

    #newBest {
      display: none;
      font-size: 20px;
      margin: 10px;
    }

    button {
      background: white;
      border: none;
      border-radius: 10px;
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

<div id="score">Distance: 0</div>

<div id="info">
  ← → to steer
</div>

<!-- GAME OVER -->

<div id="gameOverScreen">

  <div id="gameOverBox">

    <h1>Game Over!</h1>

    <div id="finalScore">
      Score: 0
    </div>

    <div id="bestScore">
      Best: 0
    </div>

    <div id="newBest">
      🏆 NEW BEST!
    </div>

    <button onclick="restartGame()">
      Play Again
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

  // -------------------------
  // Scene
  // -------------------------

  const scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x87ceeb);

  scene.fog =
    new THREE.Fog(0x87ceeb, 30, 180);


  // -------------------------
  // Camera
  // -------------------------

  const camera =
    new THREE.PerspectiveCamera(
      70,
      window.innerWidth /
      window.innerHeight,
      0.1,
      500
    );

  camera.position.set(0, 5, 10);


  // -------------------------
  // Renderer
  // -------------------------

  const renderer =
    new THREE.WebGLRenderer({
      antialias: true
    });

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );

  document.body.appendChild(
    renderer.domElement
  );


  // -------------------------
  // Lighting
  // -------------------------

  const sunlight =
    new THREE.DirectionalLight(
      0xffffff,
      2
    );

  sunlight.position.set(
    10,
    20,
    10
  );

  scene.add(sunlight);


  const ambient =
    new THREE.AmbientLight(
      0xffffff,
      1
    );

  scene.add(ambient);


  // -------------------------
  // Snow
  // -------------------------

  const trackGeometry =
    new THREE.PlaneGeometry(
      18,
      400
    );

  const trackMaterial =
    new THREE.MeshStandardMaterial({
      color: 0xffffff
    });

  const track =
    new THREE.Mesh(
      trackGeometry,
      trackMaterial
    );

  track.rotation.x =
    -Math.PI / 2;

  track.position.z = -150;

  scene.add(track);


  // -------------------------
  // Sled
  // -------------------------

  const sled =
    new THREE.Group();


  const bodyGeometry =
    new THREE.BoxGeometry(
      1.5,
      0.4,
      2.5
    );

  const bodyMaterial =
    new THREE.MeshStandardMaterial({
      color: 0xff3333
    });

  const body =
    new THREE.Mesh(
      bodyGeometry,
      bodyMaterial
    );

  body.position.y = 0.7;

  sled.add(body);


  const seatGeometry =
    new THREE.BoxGeometry(
      1,
      0.5,
      1
    );

  const seatMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x222222
    });

  const seat =
    new THREE.Mesh(
      seatGeometry,
      seatMaterial
    );

  seat.position.y = 1.05;

  seat.position.z = 0.2;

  sled.add(seat);


  sled.position.set(
    0,
    0,
    5
  );

  scene.add(sled);


  // -------------------------
  // Obstacles
  // -------------------------

  const obstacles = [];


  function createObstacle(z) {

    const geometry =
      new THREE.DodecahedronGeometry(1);

    const material =
      new THREE.MeshStandardMaterial({
        color: 0x777777
      });

    const rock =
      new THREE.Mesh(
        geometry,
        material
      );

    rock.position.x =
      Math.random() * 12 - 6;

    rock.position.y = 1;

    rock.position.z = z;

    scene.add(rock);

    obstacles.push(rock);
  }


  for (
    let i = 0;
    i < 30;
    i++
  ) {

    createObstacle(
      -20 - i * 12
    );

  }


  // -------------------------
  // Controls
  // -------------------------

  const keys = {
    left: false,
    right: false
  };


  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "ArrowLeft"
      ) {
        keys.left = true;
      }

      if (
        event.key === "ArrowRight"
      ) {
        keys.right = true;
      }

    }
  );


  document.addEventListener(
    "keyup",
    event => {

      if (
        event.key === "ArrowLeft"
      ) {
        keys.left = false;
      }

      if (
        event.key === "ArrowRight"
      ) {
        keys.right = false;
      }

    }
  );


  // -------------------------
  // Game variables
  // -------------------------

  let speed = 0.35;

  let distance = 0;

  let gameOver = false;


  // -------------------------
  // Best score
  // -------------------------

  let bestScore =
    Number(
      localStorage.getItem(
        "snowRideBest"
      )
    ) || 0;


  // -------------------------
  // GAME OVER
  // -------------------------

  function endGame() {

    gameOver = true;

    const final =
      Math.floor(distance);

    const isNewBest =
      final > bestScore;


    if (isNewBest) {

      bestScore = final;

      localStorage.setItem(
        "snowRideBest",
        bestScore
      );

    }


    document.getElementById(
      "finalScore"
    ).textContent =
      "Score: " + final;


    document.getElementById(
      "bestScore"
    ).textContent =
      "Best: " + bestScore;


    document.getElementById(
      "newBest"
    ).style.display =
      isNewBest
        ? "block"
        : "none";


    document.getElementById(
      "gameOverScreen"
    ).style.display =
      "flex";

  }


  // -------------------------
  // RESTART
  // -------------------------

  function restartGame() {

    distance = 0;

    speed = 0.35;

    gameOver = false;

    sled.position.x = 0;

    sled.rotation.z = 0;


    obstacles.forEach(
      (rock, index) => {

        rock.position.z =
          -20 - index * 12;

        rock.position.x =
          Math.random() * 12 - 6;

      }
    );


    document.getElementById(
      "score"
    ).textContent =
      "Distance: 0";


    document.getElementById(
      "gameOverScreen"
    ).style.display =
      "none";

  }


  // -------------------------
  // GAME LOOP
  // -------------------------

  function animate() {

    requestAnimationFrame(
      animate
    );


    if (!gameOver) {

      // Steering

      if (keys.left) {

        sled.position.x -= 0.18;

        sled.rotation.z +=
          0.025;

      }


      if (keys.right) {

        sled.position.x += 0.18;

        sled.rotation.z -=
          0.025;

      }


      // Track boundaries

      sled.position.x =
        Math.max(
          -7,
          Math.min(
            7,
            sled.position.x
          )
        );


      sled.rotation.z *= 0.94;


      // Move rocks

      obstacles.forEach(
        rock => {

          rock.position.z += speed;

          rock.rotation.x +=
            0.01;

          rock.rotation.y +=
            0.02;


          // Dodged

          if (
            rock.position.z > 15
          ) {

            rock.position.z =
              -250 -
              Math.random() * 50;

            rock.position.x =
              Math.random() * 12 - 6;

            distance += 10;


            document.getElementById(
              "score"
            ).textContent =
              "Distance: " +
              Math.floor(distance);

          }


          // Collision

          const dx =
            Math.abs(
              rock.position.x -
              sled.position.x
            );


          const dz =
            Math.abs(
              rock.position.z -
              sled.position.z
            );


          if (
            dx < 1.5 &&
            dz < 1.8
          ) {

            endGame();

          }

        }
      );


      // Camera

      camera.position.x +=
        (
          sled.position.x -
          camera.position.x
        ) * 0.08;


      camera.lookAt(
        sled.position.x,
        1,
        -20
      );

    }


    renderer.render(
      scene,
      camera
    );

  }


  animate();


  // -------------------------
  // Resize
  // -------------------------

  window.addEventListener(
    "resize",
    () => {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    }
  );

</script>

</body>
</html>
